[Match]
Distribution=ubuntu

[Distribution]
Release=resolute
Repositories=restricted,universe,multiverse

[Content]
# lsm= replaces the kernel's default list, so retain Ubuntu's default LSMs.
KernelCommandLine=lsm=landlock,lockdown,yama,integrity,apparmor,bpf

Packages=
        coreutils-from-gnu
        coreutils-from-uutils-
        fwupd-signed
        linux-tools-common
        linux-tools-virtual
        rust-coreutils-
        ubuntu-keyring
